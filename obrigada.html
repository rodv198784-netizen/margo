<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bem-vinda ao Margo</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F2;color:#2A2220;font-family:Inter,system-ui,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:40px 20px}
.mark{width:44px;height:44px;border-radius:12px;background:#C2410C;color:#fff;display:grid;place-items:center;font:700 24px Fraunces,serif}
h1{font-family:Fraunces,serif;font-size:34px;line-height:1.1;margin:18px 0 10px}
p{color:#6F6460;font-size:17px}
ol{padding-left:20px}li{margin:10px 0;font-size:16px}
.btn{display:block;text-align:center;background:#C2410C;color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:15px;margin:12px 0}
.btn.s{background:#fff;color:#2A2220;border:1px solid #EADFD6}
small{color:#6F6460}
</style>
</head>
<body><div class="w">
<div class="mark">m</div>
<h1 id="h"></h1><p id="p"></p>
<ol><li id="l1"></li><li id="l2"></li><li id="l3"></li></ol>
<a class="btn" id="app"></a><a class="btn s" id="grp" target="_blank" rel="noopener"></a>
<small id="s"></small>
</div>
<script>
const CONFIG={appUrl:"/margo/app/",group:{pt:"LINK_DO_GRUPO_WHATSAPP_PT",es:"LINK_DO_GRUPO_WHATSAPP_ES",en:"LINK_FOUNDERS_COMMUNITY_EN"},email:"support@vglobalventures.com"};
const T={pt:{h:"Você é uma fundadora do Margo!",p:"Seu pagamento foi confirmado e o seu preço está travado enquanto você for assinante.",
l1:"Abra o Margo e salve na tela inicial do celular (no menu do navegador, “Adicionar à tela inicial”).",l2:"Em Ajustes, coloque o nome do seu negócio e quanto vale sua hora.",l3:"Nos próximos dias você recebe por e-mail o convite para o grupo das fundadoras, onde revisamos preços juntas.",
app:"Abrir o Margo",grp:"Entrar no grupo das fundadoras",s:"Dúvidas ou reembolso (30 dias): "},
es:{h:"¡Eres fundadora de Margo!",p:"Tu pago fue confirmado y tu precio queda congelado mientras sigas suscrita.",
l1:"Abre Margo y guárdalo en la pantalla de inicio del celular (en el menú del navegador, “Agregar a pantalla de inicio”).",l2:"En Ajustes, escribe el nombre de tu negocio y cuánto vale tu hora.",l3:"En los próximos días recibirás por correo la invitación al grupo de fundadoras, donde revisamos precios juntas.",
app:"Abrir Margo",grp:"Unirme al grupo de fundadoras",s:"Dudas o reembolso (30 días): "},
en:{h:"You're a Margo founding member!",p:"Your payment is confirmed and your price is locked for as long as you stay subscribed.",l1:"Open Margo and add it to your phone's home screen (browser menu, “Add to Home Screen”).",l2:"In Settings, enter your bakery's name and what your hour is worth.",l3:"In the next few days you'll get an email invite to the founders' community, where we review prices together.",app:"Open Margo",grp:"Join the founders' community",s:"Questions or refunds (30 days): "}};
const qs=new URLSearchParams(location.search);const sid=qs.get("session_id")||"";if(/^cs_(live|test)_/.test(sid)){try{localStorage.setItem("margo.pro",JSON.stringify({since:Date.now(),sid:sid.slice(0,24)}));}catch(e){}}
const q=qs.get("lang");const L=["es","en"].includes(q)?q:"pt";document.documentElement.lang=L;
for(const k of ["h","p","l1","l2","l3","app","grp"])document.getElementById(k).textContent=T[L][k];
document.getElementById("s").textContent=T[L].s+CONFIG.email;
document.getElementById("app").href=CONFIG.appUrl;const g=CONFIG.group[L];if(!g||!/^https?:/.test(g))document.getElementById("grp").style.display="none";else document.getElementById("grp").href=g;
</script>
</body></html>
