const NL=(navigator.language||"pt").slice(0,2);
let L=(new URLSearchParams(location.search).get("lang"))||(NL==="es"?"es":NL==="pt"?"pt":"en");
if(!T[L])L="pt";
const n=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:0};
function fmt(v){return new Intl.NumberFormat({pt:"pt-BR",es:"es-419",en:"en-US"}[L],{style:"currency",currency:L==="pt"?"BRL":"USD"}).format(v)}
const DEF={pt:{cI:"28.50",cY:"25",cP:"0.10",cM:"90",cH:"20",cN:"2.50"},es:{cI:"9.50",cY:"25",cP:"0.05",cM:"90",cH:"6",cN:"0.80"},en:{cI:"9.50",cY:"24",cP:"0.15",cM:"90",cH:"18",cN:"1.50"}};
let dirty=false;
function calc(){
  const ing=n(cI.value),y=Math.max(1,n(cY.value)),pk=n(cP.value),m=n(cM.value),h=n(cH.value),now=n(cN.value);
  const cost=(ing+h*m/60)/y+pk, price=Math.ceil(cost/0.7*100)/100;
  rV.textContent=fmt(price);rD.textContent=`${T[L].cost}: ${fmt(cost)} · ${T[L].profit}: ${fmt(price-cost)}`;
  const x=document.getElementById("rX");
  if(now>0){const pr=now-cost,p=Math.round(pr/now*100);x.style.display="block";
    if(pr<0){x.style.background="var(--badbg)";x.style.color="var(--bad)";x.textContent=T[L].loss.replace("{v}",fmt(-pr));}
    else if(p<15){x.style.background="#FEF3C7";x.style.color="#B45309";x.textContent=T[L].thin.replace("{p}",p);}
    else{x.style.background="var(--okbg)";x.style.color="var(--ok)";x.textContent=T[L].good.replace("{p}",p);}
  } else x.style.display="none";
}
function render(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[L][e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  const app=CONFIG.appUrl+(CONFIG.appUrl.includes("?")?"&":"?")+CONFIG.utm;
  ctaApp.href=app;ctaApp2.href=app;
  ctaBuy.href=CONFIG.buyUrl[L];ctaBuy.target="_blank";ctaBuy.rel="noopener";
  if(!dirty)for(const k in DEF[L])document.getElementById(k).value=DEF[L][k];
  calc();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;render();});
["cI","cY","cP","cM","cH","cN"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{dirty=true;calc();}));
render();
</script>
